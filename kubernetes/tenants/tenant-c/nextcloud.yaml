apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
spec:
  storageClassName: ceph-rbd
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: nextcloud }
  template:
    metadata:
      labels: { app: nextcloud }
    spec:
      containers:
        - name: nextcloud
          image: nextcloud:31-apache
          ports: [{ containerPort: 80 }]
          env:
            - { name: MYSQL_HOST, value: mysql }
            - { name: MYSQL_DATABASE, value: nextcloud }
            - { name: MYSQL_USER, value: nextcloud }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-credentials, key: password }
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef: { name: nextcloud-admin, key: username }
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: nextcloud-admin, key: password }
          volumeMounts:
            - { name: data, mountPath: /var/www/html }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: nextcloud-data }
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
spec:
  selector: { app: nextcloud }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud-http
spec:
  podSelector:
    matchLabels: { app: nextcloud }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-system }
      ports:
        - { protocol: TCP, port: 80 }
