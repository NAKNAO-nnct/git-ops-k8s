apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: immich }
  template:
    metadata:
      labels: { app: immich }
    spec:
      containers:
        - name: immich
          image: ghcr.io/immich-app/immich-server:v3.3.6
          ports: [{ containerPort: 2283 }]
          env:
            - { name: DB_HOSTNAME, value: postgres }
            - { name: DB_USERNAME, value: immich }
            - { name: DB_DATABASE_NAME, value: immich }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: immich-db, key: password }
            - { name: REDIS_HOSTNAME, value: redis }
            - { name: IMMICH_MACHINE_LEARNING_URL, value: "http://immich-ml:3003" }
          volumeMounts:
            - { name: media, mountPath: /data }
      volumes:
        - name: media
          persistentVolumeClaim: { claimName: immich-media }
---
apiVersion: v1
kind: Service
metadata:
  name: immich
spec:
  selector: { app: immich }
  ports: [{ port: 2283, targetPort: 2283 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-ml
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: immich-ml }
  template:
    metadata:
      labels: { app: immich-ml }
    spec:
      containers:
        - name: ml
          image: ghcr.io/immich-app/immich-machine-learning:v3.3.6
          ports: [{ containerPort: 3003 }]
          volumeMounts:
            - { name: cache, mountPath: /cache }
      volumes:
        - name: cache
          persistentVolumeClaim: { claimName: immich-ml-cache }
---
apiVersion: v1
kind: Service
metadata:
  name: immich-ml
spec:
  selector: { app: immich-ml }
  ports: [{ port: 3003, targetPort: 3003 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: immich }
            - { name: POSTGRES_DB, value: immich }
            - { name: POSTGRES_INITDB_ARGS, value: "--data-checksums" }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: immich-db, key: password }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: immich-postgres }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
