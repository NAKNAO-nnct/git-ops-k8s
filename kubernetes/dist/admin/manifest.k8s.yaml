apiVersion: v1
kind: Namespace
metadata:
  name: platform-admin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-admin
  namespace: platform-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-admin
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - create
      - delete
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenant-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-admin
subjects:
  - kind: ServiceAccount
    name: tenant-admin
    namespace: platform-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-admin
  namespace: platform-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenant-admin
  template:
    metadata:
      labels:
        app: tenant-admin
    spec:
      containers:
        - env:
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: SESSION_DRIVER
              value: file
            - name: CACHE_STORE
              value: file
            - name: PLATFORM_WRITES_ENABLED
              value: "false"
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  key: app-key
                  name: tenant-admin-auth
            - name: PLATFORM_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: tenant-admin-auth
            - name: PLATFORM_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  key: password-hash
                  name: tenant-admin-auth
          image: example.invalid/tenant-admin:0.1.0
          name: admin
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /up
              port: 8000
      serviceAccountName: tenant-admin
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-admin
  namespace: platform-admin
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: tenant-admin
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-inbound
  namespace: platform-admin
spec:
  podSelector: {}
  policyTypes:
    - Ingress
