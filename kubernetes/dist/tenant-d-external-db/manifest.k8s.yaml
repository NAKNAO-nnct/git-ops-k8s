apiVersion: v1
kind: Namespace
metadata:
  labels:
    platform.example/tenant: tenant-d
  name: tenant-d
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: tenant-d
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: same-tenant-and-dns
  namespace: tenant-d
spec:
  egress:
    - to:
        - podSelector: {}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
  ingress:
    - from:
        - podSelector: {}
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: tenant-d
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: tenant-d
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tenant-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - image: redis:7.4-alpine
          name: redis
          ports:
            - containerPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: tenant-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - env:
            - name: MYSQL_HOST
              value: mysql-external
            - name: MYSQL_DATABASE
              value: app
            - name: MYSQL_USER
              value: app
            - name: REDIS_HOST
              value: redis
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: mysql-credentials
          image: example.invalid/tenant-d-web:0.1.0
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 5
          name: web
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-http
  namespace: tenant-d
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-external
  namespace: tenant-d
spec:
  externalName: tenant-d-db.example.invalid
  type: ExternalName
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-mysql
  namespace: tenant-d
spec:
  egress:
    - ports:
        - port: 3306
          protocol: TCP
      to:
        - ipBlock:
            cidr: 172.28.104.10/32
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Egress
