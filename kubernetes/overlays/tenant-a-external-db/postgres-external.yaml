apiVersion: v1
kind: Service
metadata:
  name: postgres-external
spec:
  type: ExternalName
  externalName: tenant-a-db.example.invalid
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-postgres
spec:
  podSelector:
    matchLabels: { app: immich }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 172.28.101.10/32 }
      ports:
        - { protocol: TCP, port: 5432 }
