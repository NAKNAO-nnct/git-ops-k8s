apiVersion: v1
kind: Service
metadata:
  name: mysql-external
spec:
  type: ExternalName
  externalName: tenant-d-db.example.invalid
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-mysql
spec:
  podSelector:
    matchLabels: { app: web }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 172.28.104.10/32 }
      ports:
        - { protocol: TCP, port: 3306 }
