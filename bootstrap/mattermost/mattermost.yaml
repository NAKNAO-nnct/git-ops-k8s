apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mattermost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mattermost
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:17@sha256:e711be2c7ff64c9eb8883fc87571621be6caa2f943d825a49e5d20ac5b0221d7
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h postgres.mattermost.svc.cluster.local -p 5432 -U mattermost -d mattermost >/dev/null 2>&1; do
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      containers:
        - name: mattermost
          image: mattermost/mattermost-team-edition:12.1.0@sha256:35927b9c535a9eb74f0e45385d3fe5d8308b16e0464031f157a834da8af3ee73
          imagePullPolicy: IfNotPresent
          env:
            - name: MM_SQLSETTINGS_DRIVERNAME
              value: postgres
            - name: MM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mattermost-db
                  key: MATTERMOST_DB_PASSWORD
            - name: MM_SQLSETTINGS_DATASOURCE
              value: 'postgres://mattermost:$(MM_DB_PASSWORD)@postgres.mattermost.svc.cluster.local:5432/mattermost?sslmode=disable&connect_timeout=10'
            - name: MM_SERVICESETTINGS_SITEURL
              value: https://chat.wantan.men
            - name: MM_FILESETTINGS_DRIVERNAME
              value: local
            - name: MM_FILESETTINGS_DIRECTORY
              value: /mattermost/data/
          ports:
            - name: http
              containerPort: 8065
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v4/system/ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /mattermost/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mattermost-data
---
apiVersion: v1
kind: Service
metadata:
  name: mattermost
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mattermost
  ports:
    - name: http
      port: 8065
      targetPort: http
      protocol: TCP
