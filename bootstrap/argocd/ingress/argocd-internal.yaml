apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: argocd-server
  namespace: argocd
spec:
  insecureSkipVerify: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-internal
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: argocd-argocd-server@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - argocd.internal.misosiru.uk
      secretName: argocd-internal-misosiru-uk-tls
  rules:
    - host: argocd.internal.misosiru.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
