apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mattermost
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/NAKNAO-nnct/git-ops-k8s.git
    targetRevision: main
    path: bootstrap/mattermost
  destination:
    server: https://kubernetes.default.svc
    namespace: mattermost
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
