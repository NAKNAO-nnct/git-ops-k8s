apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/actions/actions-runner-controller.git
    targetRevision: gha-runner-scale-set-0.15.1
    path: charts/gha-runner-scale-set-controller/crds
    directory: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
