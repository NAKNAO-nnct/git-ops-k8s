apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/NAKNAO-nnct/git-ops-k8s.git
    targetRevision: main
    path: bootstrap/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
