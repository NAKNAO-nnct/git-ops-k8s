apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-cloud
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: 4.6.2
    helm:
      releaseName: grafana-cloud
      valuesObject:
        cluster:
          name: proxmox-k3s
        collectorCommon:
          alloy:
            remoteConfig:
              enabled: true
              url: https://fleet-management-prod-019.grafana.net
              auth:
                type: basic
              secret:
                create: false
                name: grafana-cloud-credentials
                namespace: monitoring
        destinations:
          grafana-cloud-otlp:
            type: otlp
            protocol: http
            url: https://otlp-gateway-prod-ap-northeast-0.grafana.net/otlp
            metrics:
              enabled: true
            logs:
              enabled: true
            traces:
              enabled: true
            auth:
              type: basic
              username: "1210959"
              passwordFrom: sys.env("GCLOUD_RW_API_KEY")
        applicationObservability:
          enabled: true
          destinations:
            - grafana-cloud-otlp
          collector: alloy
          receivers:
            otlp:
              grpc:
                enabled: true
              http:
                enabled: true
          connectors:
            grafanaCloudMetrics:
              enabled: false
        collectors:
          alloy:
            extraService:
              enabled: true
              fullname: grafana-cloud-alloy-otlp
            presets:
              - small
              - clustered
              - service-discovery
              - daemonset
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
