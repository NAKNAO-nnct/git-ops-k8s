apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-cloud
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: 4.6.2
    helm:
      releaseName: grafana-cloud
      valuesObject:
        cluster:
          name: proxmox-k3s
        collectorCommon:
          alloy:
            remoteConfig:
              enabled: true
              url: https://fleet-management-prod-019.grafana.net
              auth:
                type: basic
              secret:
                create: false
                name: grafana-cloud-credentials
                namespace: monitoring
        destinations:
          grafana-cloud-otlp:
            type: otlp
            protocol: http
            url: https://otlp-gateway-prod-ap-northeast-0.grafana.net/otlp
            metrics:
              enabled: true
            logs:
              enabled: true
            traces:
              enabled: true
            auth:
              type: basic
              username: "1210959"
              passwordFrom: sys.env("GCLOUD_RW_API_KEY")
        applicationObservability:
          enabled: true
          destinations:
            - grafana-cloud-otlp
          collector: alloy
          receivers:
            otlp:
              grpc:
                enabled: true
              http:
                enabled: true
          connectors:
            grafanaCloudMetrics:
              enabled: false
        clusterMetrics:
          enabled: true
          destinations:
            - grafana-cloud-otlp
          collector: alloy
        hostMetrics:
          enabled: true
          destinations:
            - grafana-cloud-otlp
          collector: alloy
          linuxHosts:
            enabled: true
          energyMetrics:
            enabled: true
        costMetrics:
          enabled: true
          destinations:
            - grafana-cloud-otlp
          collector: alloy
        clusterEvents:
          enabled: true
          destinations:
            - grafana-cloud-otlp
          collector: alloy
        podLogsViaOpenTelemetry:
          enabled: true
          destinations:
            - grafana-cloud-otlp
          collector: alloy
          namespaces:
            - cert-manager
            - kube-system
            - metallb-system
            - monitoring
            - traefik
        kubernetesManifests:
          enabled: true
          destinations:
            - grafana-cloud-otlp
          collector: alloy
        selfReporting:
          enabled: true
          destinations:
            - grafana-cloud-otlp
        collectors:
          alloy:
            extraService:
              enabled: true
              fullname: grafana-cloud-alloy-otlp
            presets:
              - small
              - clustered
              - service-discovery
              - daemonset
        telemetryServices:
          kube-state-metrics:
            deploy: true
          node-exporter:
            deploy: true
          kepler:
            deploy: true
          opencost:
            deploy: true
            metricsSource: custom
            opencost:
              exporter:
                defaultClusterId: proxmox-k3s
              prometheus:
                existingSecretName: grafana-cloud-credentials
                external:
                  enabled: true
                  url: https://prometheus-prod-49-prod-ap-northeast-0.grafana.net/api/prom/api/v1/query
          k8s-manifest-tail:
            deploy: true
            config:
              excludeNamespaces:
                - argocd
                - cilium-secrets
                - kube-system
                - mattermost
                - monitoring
              logging:
                logDiffs: compact
                logManifests: false
              objects:
                - apiVersion: v1
                  kind: Pod
                - apiVersion: apps/v1
                  kind: Deployment
                - apiVersion: apps/v1
                  kind: StatefulSet
                - apiVersion: apps/v1
                  kind: DaemonSet
                - apiVersion: batch/v1
                  kind: Job
                - apiVersion: batch/v1
                  kind: CronJob
                - apiVersion: v1
                  kind: Service
                - apiVersion: networking.k8s.io/v1
                  kind: Ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
