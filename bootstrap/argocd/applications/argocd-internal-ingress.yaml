apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-internal-ingress
  namespace: argocd
spec:
  project: default
  ignoreDifferences:
    - group: ""
      kind: Service
      name: argocd-server
      namespace: argocd
      jsonPointers:
        - /spec
  source:
    repoURL: https://github.com/NAKNAO-nnct/git-ops-k8s.git
    targetRevision: main
    path: bootstrap/argocd/ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
