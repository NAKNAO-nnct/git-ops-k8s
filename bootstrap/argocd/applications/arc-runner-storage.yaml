apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-storage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/NAKNAO-nnct/git-ops-k8s.git
    targetRevision: main
    path: bootstrap/arc-runners/storage
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
