apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-large
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.15.1
    helm:
      releaseName: arc-large
      valuesObject:
        githubConfigUrl: https://github.com/Yamada-Factory
        githubConfigSecret: arc-github-app
        runnerScaleSetName: large
        minRunners: 0
        containerMode: {}
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-controller
        template:
          spec:
            automountServiceAccountToken: false
            securityContext:
              fsGroup: 1001
              fsGroupChangePolicy: OnRootMismatch
            initContainers:
              - name: init-dind-externals
                image: ghcr.io/actions/actions-runner:latest
                command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
                volumeMounts:
                  - name: dind-externals
                    mountPath: /home/runner/tmpDir
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    cpu: 50m
                    memory: 128Mi
              - name: dind
                image: docker:dind
                args:
                  - dockerd
                  - --host=unix:///var/run/docker.sock
                  - --group=$(DOCKER_GROUP_GID)
                env:
                  - name: DOCKER_GROUP_GID
                    value: "123"
                securityContext:
                  privileged: true
                restartPolicy: Always
                startupProbe:
                  exec:
                    command:
                      - docker
                      - info
                  initialDelaySeconds: 0
                  failureThreshold: 24
                  periodSeconds: 5
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: work
                    mountPath: /var/lib/docker
                  - name: dind-sock
                    mountPath: /var/run
                  - name: dind-externals
                    mountPath: /home/runner/externals
                resources:
                  requests:
                    cpu: "12"
                    memory: 12Gi
                  limits:
                    cpu: "12"
                    memory: 12Gi
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:latest
                command: ["/home/runner/run.sh"]
                env:
                  - name: DOCKER_HOST
                    value: unix:///var/run/docker.sock
                  - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                    value: "120"
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
                resources:
                  requests:
                    cpu: "4"
                    memory: 4Gi
                  limits:
                    cpu: "4"
                    memory: 4Gi
            volumes:
              - name: work
                ephemeral:
                  volumeClaimTemplate:
                    spec:
                      accessModes:
                        - ReadWriteOnce
                      storageClassName: ceph-rbd-ephemeral
                      resources:
                        requests:
                          storage: 50Gi
              - name: dind-sock
                emptyDir: {}
              - name: dind-externals
                emptyDir: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
