apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: s3-csi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://yandex-cloud.github.io/k8s-csi-s3/charts
    chart: csi-s3
    targetRevision: 0.43.7
    helm:
      releaseName: csi-s3
      valuesObject:
        secret:
          create: false
        storageClass:
          create: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
